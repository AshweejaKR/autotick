mode: live
broker: angelone
strategy: swing

market:
  symbols: []
  exchange: NSE

strategy_config:
  csv_file: "swing_watchlist.csv"

capital: 100000

trade:
  quantity: 1
  position_type: POSITIONAL

risk:
  max_loss: -2000
  max_trades_per_day: 5
  risk_per_trade_pct: 1
  stoploss_pct: 2
  target_pct: 0
  trailing_activation_pct: 5
  trailing_atr_period: 14
  trailing_atr_interval: 1d
  trailing_atr_multiplier: 2.5

engine:
  loop_sleep_s: 20

reconnect:
  enabled: true
  initial_delay_s: 1
  max_delay_s: 60
  auth_max_attempts: 3

simulated:
  ui_data_enabled: false
  broker_auto_fetch: false

session:
  schedule_type: DAILY
  timezone: Asia/Kolkata
  trading_days: [MON, TUE, WED, THU, FRI]
  closed_dates: []
  market_start: "09:15"
  market_end: "15:30"
  square_off_time: "15:15"
  only_market_hours: true
  replay_speed: 1.0

backtest:
  csv:
    enabled: false
    data_file: ""

broker_config:
  angelone:
    credentials_file: "angelone_keys.env"

persistence:
  enabled: true
  state_path: "../../state/swing_verification.db"

reports:
  enabled: true
  user_id: "swing_observation"
  output_dir: "../../reports"

logging:
  enabled: true
  level: DEBUG
  log_file: "../../logs/swing_verification.log"
  timestamp: true
