mode: live
broker: angelone
strategy: swing

market:
  symbols: []  # Add NSE cash symbols to swing_watchlist.csv
  exchange: NSE

capital: 100000

strategy_config:
  csv_file: "swing_watchlist.csv"

trade:
  max_position_value: 5000
  position_type: POSITIONAL

simulated:
  margin_pct: 10

risk:
  max_loss: -2000
  max_trades_per_day: 5
  risk_per_trade_pct: 1
  stoploss_pct: 2
  target_pct: 0
  trailing_activation_pct: 5
  trailing_atr_period: 14
  trailing_atr_interval: 1d
  trailing_atr_multiplier: 2.5

engine:
  loop_sleep_s: 20

reconnect:
  enabled: true
  initial_delay_s: 1
  max_delay_s: 60
  auth_max_attempts: 3

session:
  schedule_type: DAILY
  timezone: Asia/Kolkata
  trading_days: [MON, TUE, WED, THU, FRI]
  closed_dates: []
  market_start: "09:15"
  market_end: "15:30"
  square_off_time: "15:15"
  only_market_hours: true
  startup_wait_minutes: 30
  replay_speed: 1.0

backtest:
  csv:
    enabled: false
    data_file: ""

broker_config:
  angelone:
    credentials_file: "angelone_keys.env"

persistence:
  enabled: true
  state_path: "state/swing_default.db"

reports:
  enabled: true
  user_id: ""
  output_dir: "reports"

logging:
  enabled: true
  level: INFO
  log_file: "logs/autotick.log"
  timestamp: false
