mode: live
broker: angelone
strategy: mcx_goldpetal_orb

market:
  symbols:
    - GOLDPETAL30SEP26FUT
  exchange: MCX

capital: 5000

trade:
  quantity: 1
  position_type: POSITIONAL

risk:
  max_loss: -2000
  max_trades_per_day: 5
  risk_per_trade_pct: 20
  stoploss_pct: 2
  target_pct: 5
  trailing_atr_period: 14
  trailing_atr_interval: 1d
  trailing_atr_multiplier: 2.5

engine:
  loop_sleep_s: 1

reconnect:
  enabled: true
  initial_delay_s: 1
  max_delay_s: 60
  auth_max_attempts: 3

session:
  schedule_type: DAILY
  timezone: Asia/Kolkata
  trading_days: [MON, TUE, WED, THU, FRI]
  closed_dates: []
  market_start: "09:15"
  market_end: "23:30"
  square_off_time: "23:20"
  only_market_hours: true
  replay_speed: 1.0

backtest:
  csv:
    enabled: false
    data_file: ""

broker_config:
  angelone:
    credentials_file: "angelone_keys.env"

persistence:
  enabled: true
  state_path: "state/autotick.db"

reports:
  enabled: true
  user_id: ""
  output_dir: "reports"

logging:
  enabled: true
  level: DEBUG
  log_file: "logs/autotick.log"
  timestamp: true
