mode: paper
broker: angelone
strategy: simple

market:
  symbols:
    - NIFTYBEES-EQ
    - INFY-EQ
  exchange: NSE

capital: 100000

trade:
  quantity: 10
  position_type: POSITIONAL

risk:
  max_loss: -2000
  max_trades_per_day: 5
  risk_per_trade_pct: 1
  stoploss_pct: 2
  target_pct: 5
  trailing_sl_pct: 1

engine:
  loop_sleep_s: 1

session:
  market_start: "09:15"
  market_end: "15:30"
  square_off_time: "15:15"
  only_market_hours: true
  replay_speed: 1.0

backtest:
  csv:
    enabled: false
    data_file: ""

broker_config:
  angelone:
    credentials_file: "config/angelone_keys.env"

persistence:
  enabled: true
  state_path: "state/"

logging:
  enabled: true
  level: INFO
  log_file: "logs/autotick.log"
  timestamp: true
